# ============================================
# Cash Clash Configuration
# ============================================

# Enable debug mode (logs detailed info to console)
debug: false

# ============================================
# GAME SETTINGS
# ============================================
game:
  # Player counts
  min-players: 8
  max-players: 8

  # Round configuration
  total-rounds: 7
  first-round: 1

  # Phase durations (seconds)
  combat-phase-duration: 360
  shopping-phase-duration: 90
  first-round-shopping-duration: 120
  buff-selection-duration: 15
  sudden-death-phase-duration: 180
  final-stand-duration-seconds: 180
  sudden-death-initial-cycle-seconds: 180
  sudden-death-repeat-cycle-seconds: 180

  # How many seconds before a phase timer ends to start playing the countdown ping/message
  phase-countdown-warning-seconds: 3

  # Respawn settings
  respawn-delay: 5
  respawn-protection: 5

  # Death spectator rise animation: an upward boost (eases out, not a steady lift) from the
  # player's death location, so they're quickly up at a vantage point to spectate the fight
  death-spectator-rise-height: 4.0
  death-spectator-rise-ticks: 16

  # Forfeit settings
  forfeit-enabled: true
  forfeit-delay: 10
  forfeit-combat-grace: 5

# ============================================
# ROUND SETTINGS
# ============================================
rounds:
  # Lives per round
  early-round-lives: 3
  late-round-lives: 1

  # Forfeit bonus
  forfeit-bonus: 10000

  # Kill team split bonus
  # Amount awarded to killer's team, split evenly among all team members
  kill-team-split-bonus: 7500

  # Per-player bonuses (First Blood, Killstreak, Most Kills, Most Damage) - flat amount
  # awarded only to the player who earned it
  player-bonus-amount: 2000
  # Kills needed for an uninterrupted killstreak to trigger the Killstreak bonus
  killstreak-interval: 4

  # Loss streak bonuses
  # Awarded to team that lost consecutive rounds
  loss-streak-1-bonus: 5000
  loss-streak-2-bonus: 7500
  loss-streak-3-bonus: 10000

# ============================================
# ARMOR RESTRICTIONS
# ============================================
armor:
  # Round at which diamond armor becomes unlimited
  diamond-unlock-round: 4
  # Maximum diamond pieces before unlock round
  max-diamond-pieces-early: 2

# ============================================
# ECONOMY SETTINGS
# ============================================
economy:
  # Kill rewards
  round-1-kill-reward: 3000

  # Transfer fees (percentage, 0.5 = 50%)
  round-1-transfer-fee: 0.50
  round-2-3-transfer-fee: 0.10
  round-4-5-transfer-fee: 0.05

  # Percentage steal for rounds 4-5
  late-round-steal-percentage: 0.25

  # Round-end kill pool distribution
  kill-pool-per-kill: 1000
  min-round-pool: 15000
  max-round-pool: 100000

  # Flat fee for the transfer GUI (chat-input money transfer), independent of the
  # round-based transfer fees above
  gui-transfer-fee: 0.10

# ============================================
# COMBAT SETTINGS
# ============================================
combat:
  # Multiplier applied to the Strength potion effect's attack damage bonus (1.0 = no nerf)
  strength-nerf-multiplier: 0.5
  # Multiplier applied to the Power enchantment's damage bonus (1.0 = no nerf)
  power-nerf-multiplier: 0.2
  # Power enchant level a non-legendary bow is capped at (excess levels beyond this
  # are ignored rather than nerfed) - the Wind Bow legendary is exempt
  max-power-level-regular-bow: 2

# ============================================
# CASH QUAKE EVENTS
# ============================================
cash-quake:
  # Event limits
  min-guaranteed-events: 2
  max-events-per-game: 10
  max-events-per-round: 2

  # Event timing (ticks, 600 = 30 seconds)
  event-check-interval-ticks: 600
  # Base chance for event trigger (0.30 = 30%)
  event-base-chance: 0.30

  # Lottery event
  lottery:
    entry-cost: 5000
    prize: 10000
    duration-seconds: 30

  # Weight of Wealth event
  weight-of-wealth:
    tax-cost: 5000
    duration-seconds: 20

  # Life Steal event
  life-steal:
    duration-minutes: 2
    health-per-kill: 4.0
    max-health: 40.0

  # Check Up event
  check-up:
    duration-minutes: 2
    min-hearts: 1
    max-hearts: 5

  # Broken Gear event
  broken-gear:
    duration-seconds: 30

  # Supply Drop event
  supply-drop:
    min-chests: 3
    max-extra-chests: 4
    min-coins: 1000
    max-extra-coins: 1001

# ============================================
# PLAYER DEFAULTS
# ============================================
player:
  default-health: 20.0
  max-health-cap: 40.0

# ============================================
# GAMEMODE SETTINGS
# ============================================
gamemodes:
  # Capture the Flag settings
  capture-the-flag:
    # Time required to stand on capture plate (milliseconds)
    plate-activation-time-ms: 3000
    # Win condition (sudden death is decided by a capture-count comparison per cycle instead
    # of a separate fixed threshold, so there's no distinct sudden-death win-condition value here)
    normal-captures-to-win: 2
    # Capture bonus (awarded at 45 seconds)
    capture-bonus-coins: 15000
    # Bonus timer (milliseconds)
    capture-bonus-timer-ms: 45000
    # Max health taken from a flag carrier during Final Stand (4.0 = 2 hearts, 20 -> 16 max)
    final-stand-carrier-health-penalty: 4.0
    # Extra heart duration granted on capture (milliseconds)
    heart-bonus-duration-ms: 45000
    # Radius (blocks) for detecting a player near the flag pickup point / scoring banner,
    # and the max vertical distance still counted as "near" (handles multi-level bases)
    pickup-circle-radius: 1.5
    score-zone-radius: 1.5
    max-height-difference: 5.0
    # Periodic glow "ping" revealing the flag carrier's position to the enemy team: how often
    # it pulses (ticks), how long each pulse lasts (ticks), and its Glowing amplifier level
    carrier-glow-interval-ticks: 100
    carrier-glow-duration-ticks: 10
    carrier-glow-amplifier: 0

  # Kill Confirm settings
  kill-confirm:
    score-to-win: 16
    triple-kill-streak: 3
    zone-activation-delay-ms: 1000
    zone-lifespan-ms: 9000
    bonus-zone-lifespan-ms: 13000
    capture-duration-ms: 4000
    final-stand-capture-duration-ms: 2000
    money-bonus: 15000
    heart-bonus-duration-ms: 45000
    # Activation beam: height (blocks), vertical offset from the zone center, and how long the
    # pulse lasts (ticks)
    beam-height: 6.0
    beam-y-offset: 0.2
    beam-duration-ticks: 10
    # Capture zone footprint: horizontal half-width and vertical tolerance (blocks) for
    # "standing in the zone", and how far outward to search for clear ground when a death
    # location's footprint is blocked before giving up
    zone-half-width: 1.5
    zone-vertical-tolerance: 2.0
    zone-safe-spawn-search-radius: 8
    # How far straight down (blocks) to search for solid ground beneath an airborne death
    # location before spawning the zone's footprint there, so a tag never floats in mid-air
    zone-ground-search-max-depth: 64

  # Protect the President settings
  protect-the-president:
    selection-time-seconds: 15
    kill-bonus-threshold: 2
    kill-bonus-amount: 15000
    heart-duration-ms: 45000
    captures-to-win: 2
    # Tank buff: Resistance amplifier level (0 = level I)
    tank-resistance-amplifier: 0
    # HP buff: permanent max-health increase, applied via the health modifier system (4.0 = 2 hearts)
    hp-heal-amount: 4.0

# ============================================
# SEQUENCE TITLE DURATIONS
# ============================================
# Fade-in/stay/fade-out times (milliseconds) for the titles shown during scripted sequences
# (round start reveal, sudden death start, victory). Text content lives in sequences.yml.
sequences:
  # Enable scripted title/freeze sequences (round start, president reveal, round end,
  # sudden death, victory)
  enabled: true
  title-times:
    default-fade-in-ms: 250
    default-stay-ms: 5000
    default-fade-out-ms: 250
    sudden-death-fade-in-ms: 500
    sudden-death-stay-ms: 5000
    sudden-death-fade-out-ms: 500
    victory-fade-in-ms: 500
    victory-stay-ms: 9000
    victory-fade-out-ms: 500
  # How long (seconds) each step of a sequence holds on screen before advancing to the next
  # one - this is the pacing of the sequence itself, separate from title-times above (which
  # only controls a single title's own fade-in/stay/fade-out animation)
  hold-seconds:
    # "Selecting Gamemode..." hold, and the reveal title hold afterward (round-start)
    round-start-reveal: 4
    # "Selecting President..." hold, and the reveal title hold afterward (president-reveal)
    president-reveal: 3.5
    # "Determining Shield..." hold before the countdown (shield-reveal)
    shield-reveal-determining: 2
    # Hold on the shield/no-shield result before clearing (shield-reveal)
    shield-reveal-result: 3
    # Hold on the round win/loss result before clearing (round-end)
    round-end-result: 5
    # Delay before the sudden-death announcement title appears (sudden-death)
    sudden-death-pre-announcement: 1
    # Hold on the game win/loss result, both before and after it clears (game-victory)
    victory-result: 10
  # Blindness duration (ticks) applied during "reveal"-style sequences (round start,
  # president reveal, sudden death) - generous on purpose since it's always cleared
  # explicitly at the end of the sequence, so it only needs to outlast the sequence itself
  reveal-blindness-ticks: 300


# ============================================
# SCOREBOARD CONFIGURATION
# ============================================
# Available placeholders for all scoreboards:
# - {round} = Current round number
# - {state} / {phase} = Current game phase (Shopping, Combat, Waiting, Ending)
# - {phase_number} = Phase number
# - {time} = Time remaining (MM:SS format)
# - {time_seconds} = Time remaining in seconds
# - {teamRed_coins} = Team Red total coins
# - {teamBlue_coins} = Team Blue total coins
# - {your_team} = Your team number
# - {your_team_coins} = Your team's coins
# - {team_ready} = Is your team ready? (Yes/No)
# - {enemy_team} = Enemy team number
# - {enemy_team_coins} = Enemy team's coins
# - {enemy_team_ready} = Is enemy team ready? (Yes/No)
# - {player_coins} = Your coins
# - {player_kills} = Your total kills
# - {player_lives} = Your remaining lives
# - {player_deaths} = Your deaths this round
# - {kill_streak} = Your current kill streak
# - {round_kills} = Your kills this round
# - {teamRed_alive} = Team Red alive count
# - {teamBlue_alive} = Team Blue alive count
# - {your_team_alive} = Your team's alive count
# - {enemy_team_alive} = Enemy team's alive count
# - {players} = Total players in game
# - {player} = Your player name
# - {online} = Online players (lobby only)
# - {max_online} = Max players (lobby only)
# - {wins} = Your wins (lobby only)
# - {losses} = Your losses (lobby only)
# - {kdr} = Your K/D ratio (lobby only)
# - {kills} = Your total kills (lobby only)
# - {deaths} = Your total deaths (lobby only)
# - {win_rate} = Your win rate % (lobby only)
#
# CTF-specific placeholders:
# - {teamRed_captures} = Team Red flag captures
# - {teamBlue_captures} = Team Blue flag captures
# - {teamRed_capture_circles} = Visual progress circles for Red team
# - {teamBlue_capture_circles} = Visual progress circles for Blue team
# - {red_flag_holder} = Name of Red team flag holder
# - {blue_flag_holder} = Name of Blue team flag holder
#
# PTP-specific placeholders:
# - {red_president} = Name of Red team president
# - {blue_president} = Name of Blue team president
# - {red_assassinations} = Red president assassination count
# - {blue_assassinations} = Blue president assassination count
#
scoreboard:
  # Lobby/Hub scoreboard (shown when not in a game)
  lobby:
    enabled: true
    title: "<gold><bold>Cash Clash</bold></gold>"
    lines:
      - ""
      - "<gray>Player:</gray> <white>{player}"
      - ""
      - "<yellow>Your Stats:</yellow>"
      - "<gray>Wins:</gray> <green>{wins}"
      - "<gray>Losses:</gray> <red>{losses}"
      - "<gray>K/D:</gray> <white>{kdr}"
      - ""
      - "<gray>Kills:</gray> <white>{kills}"
      - "<gray>Deaths:</gray> <white>{deaths}"
      - ""
      - "<gray>Online:</gray> <white>{online}/{max_online}"
      - ""
      - "<yellow>play.cashclash.net</yellow>"

  # Default game scoreboard (standard matches)
  game:
    enabled: true
    title: "<gold><bold>Round {round} - {phase}</bold></gold>"
    lines:
      - ""
      - "<yellow>Time:</yellow> <white>{time}"
      - "<yellow>Phase:</yellow> <white>{phase}"
      - ""
      - "<green>Your Team ({your_team}):</green>"
      - "<gray>Coins:</gray> <white>${your_team_coins}"
      - "<gray>Alive:</gray> <white>{your_team_alive}/4"
      - ""
      - "<red>Enemy Team ({enemy_team}):</red>"
      - "<gray>Coins:</gray> <white>${enemy_team_coins}"
      - "<gray>Alive:</gray> <white>{enemy_team_alive}/4"
      - ""
      - "<aqua>You:</aqua>"
      - "<gray>Coins:</gray> <gold>${player_coins}"
      - "<gray>Lives:</gray> <white>{player_lives}"
      - "<gray>Kills:</gray> <white>{player_kills}"
      - ""
      - "<yellow>play.cashclash.net</yellow>"

  # Capture the Flag gamemode scoreboard
  capture-the-flag:
    enabled: true
    title: "<gold><bold>Capture the Flag</bold></gold>"
    lines:
      - ""
      - "<red>Team Red</red>"
      - "Captures: {teamRed_captures}/2"
      - "Progress: {teamRed_capture_circles}"
      - "Coins: {teamRed_coins}"
      - ""
      - "<blue>Team Blue</blue>"
      - "Captures: {teamBlue_captures}/2"
      - "Progress: {teamBlue_capture_circles}"
      - "Coins: {teamBlue_coins}"
      - ""
      - "<yellow>Phase</yellow>: {phase}"
      - "Time: {time}"
      - ""

  # Protect the President gamemode scoreboard
  protect-the-president:
    enabled: true
    title: "<gold><bold>Protect the President</bold></gold>"
    lines:
      - ""
      - "<red>Team Red</red>"
      - "President: {red_president}"
      - "Buff: {red_buff}"
      - "Assassinations: {red_assassinations}/4"
      - "Progress: {red_assassination_circles}"
      - "Coins: {teamRed_coins}"
      - ""
      - "<blue>Team Blue</blue>"
      - "President: {blue_president}"
      - "Buff: {blue_buff}"
      - "Assassinations: {blue_assassinations}/4"
      - "Progress: {blue_assassination_circles}"
      - "Coins: {teamBlue_coins}"
      - ""
      - "<yellow>Phase</yellow>: {phase}"
      - "Time: {time}"
      - ""

  # Capture the Flag - Sudden Death scoreboard
  capture-the-flag-sudden-death:
    enabled: true
    title: "<gold><bold>⚡ SUDDEN DEATH ⚡</bold></gold>"
    lines:
      - ""
      - "<gold><bold>SUDDEN DEATH ACTIVATED!</bold></gold>"
      - ""
      - "<red>Team Red</red>"
      - "Captures: {teamRed_captures}"
      - "Round Captures: {teamRed_round_captures}"
      - "Coins: {teamRed_coins}"
      - ""
      - "<blue>Team Blue</blue>"
      - "Captures: {teamBlue_captures}"
      - "Round Captures: {teamBlue_round_captures}"
      - "Coins: {teamBlue_coins}"
      - ""
      - "<yellow>Round {round}</yellow>"
      - "Time: {sudden_death_timer}"
      - ""

  # Protect the President - Sudden Death scoreboard
  protect-the-president-sudden-death:
    enabled: true
    title: "<gold><bold>⚡ SUDDEN DEATH ⚡</bold></gold>"
    lines:
      - ""
      - "<gold><bold>SUDDEN DEATH ACTIVATED!</bold></gold>"
      - ""
      - "<red>Team Red</red>"
      - "President: {red_president}"
      - "Buff: {red_buff}"
      - "Round Kills: {teamRed_round_kills}"
      - "Coins: {teamRed_coins}"
      - ""
      - "<blue>Team Blue</blue>"
      - "President: {blue_president}"
      - "Buff: {blue_buff}"
      - "Round Kills: {teamBlue_round_kills}"
      - "Coins: {teamBlue_coins}"
      - ""
      - "<yellow>Round {round}</yellow>"
      - "Time: {sudden_death_timer}"
      - ""

  # Kill Confirm gamemode scoreboard
  kill-confirm:
    enabled: true
    title: "<gold><bold>Kill Confirm</bold></gold>"
    lines:
      - ""
      - "<red>Team Red</red>"
      - "Score: {teamRed_kc_progress}"
      - "Coins: {teamRed_coins}"
      - ""
      - "<blue>Team Blue</blue>"
      - "Score: {teamBlue_kc_progress}"
      - "Coins: {teamBlue_coins}"
      - ""
      - "{player_heart_timer}"
      - "<yellow>Phase</yellow>: {phase}"
      - "Time: {time}"
      - ""

  # Kill Confirm - Sudden Death scoreboard
  kill-confirm-sudden-death:
    enabled: true
    title: "<gold><bold>⚡ SUDDEN DEATH ⚡</bold></gold>"
    lines:
      - ""
      - "<gold><bold>SUDDEN DEATH ACTIVATED!</bold></gold>"
      - ""
      - "<red>Team Red</red>"
      - "Score: {teamRed_kc_score}"
      - "Coins: {teamRed_coins}"
      - ""
      - "<blue>Team Blue</blue>"
      - "Score: {teamBlue_kc_score}"
      - "Coins: {teamBlue_coins}"
      - ""
      - "{player_heart_timer}"
      - "<yellow>Round {round}</yellow>"
      - "Time: {sudden_death_timer}"
      - ""

# ============================================
# NPC CONFIGURATION
# ============================================
npc:
  # Arena selector NPC (Mannequin)
  arena:
    # Display name shown above the NPC (MiniMessage format)
    display-name: "<gold><bold>Arena Selector</bold></gold>"
    # Skin texture value (base64 encoded)
    # Get custom skins from https://mineskin.org/
    # Leave empty for default Steve skin
    skin-url: "https://textures.minecraft.net/texture/c2e93825cdc4c7ec014143f170ff05ef7ca5f3606716eb5429eb427bb05b7e17"

# ============================================
# REJOIN SETTINGS
# ============================================
rejoin:
  # Enable the rejoin system for disconnected players
  enabled: true
  # How long (seconds) a player has to rejoin after disconnecting
  timeout-seconds: 120
  # Restore player inventory on rejoin
  restore-inventory: true
  # Restore player balance on rejoin
  restore-balance: true

# ============================================
# AFK SETTINGS
# ============================================
afk:
  # How long (minutes) a player can stay idle in the lobby before being kicked (0 = disabled)
  lobby-kick-minutes: 5
  # Seconds before the timeout at which the player is warned (0 = no warning)
  warning-seconds: 15

# ============================================
# LEADERBOARD SETTINGS
# ============================================
leaderboard:
  # How many entries to show per board
  size: 10
  # How often (minutes) the leaderboards are recomputed (async worker)
  refresh-minutes: 5

